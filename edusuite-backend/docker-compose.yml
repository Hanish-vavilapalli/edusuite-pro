services:
  db:
    image: postgres:16-alpine
    container_name: edusuite_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_password
      POSTGRES_DB: edusuite_db
    ports:
      - '5433:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d edusuite_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4
    container_name: edusuite_pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@edusuite.com
      PGADMIN_DEFAULT_PASSWORD: admin_password
    ports:
      - '5051:80'
    depends_on:
      - db

volumes:
  postgres_data:
